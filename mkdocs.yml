site_name: AI Image Generator Documentation
site_description: Documentation for the AI Image Generator project
site_author: Your Name

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - admonition
  - footnotes
  - meta
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Basic Usage: user-guide/basic-usage.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JoeBuydemDips/ai-image-gen

# GitHub Pages configuration
site_url: https://JoeBuydemDips.github.io/ai-image-gen/
repo_url: https://github.com/JoeBuydemDips/ai-image-gen
edit_uri: edit/main/docs/
